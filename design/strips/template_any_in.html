<!DOCTYPE html>
<html lang="fr" xmlns="http://www.w3.org/1999/xhtml">
<head>

    <title>In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sometype+Mono:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
    <style media="all,print">
        @media print {
            @page { margin: 0; size: landscape; }
            html { margin-top: 12mm !important; }
            body { margin: 0; }
        }
        * { box-sizing: border-box; }
        html, body { width: 200mm; height: 26mm; margin: 0; padding: 0; font-family: "Sometype Mono", monospace; color: #000; }
        html { margin-top: 2mm; }

        #strip {
            position: relative; width: 242mm; height: 26mm; margin: 0 0 0 5px;
            background: #EDC282; border: 0.3mm solid #000; overflow: hidden;
            -webkit-print-color-adjust: exact; print-color-adjust: exact;
        }
        .v { position: absolute; width: 0; border-left: 0.3mm solid #000; }
        .h { position: absolute; height: 0; border-top: 0.3mm solid #000; }
        .bar { position: absolute; left: 72.5mm; top: 0; width: 0; height: 26mm; border-left: 2.5mm solid #1E5AA8; }
        .mark { position: absolute; left: 0; top: 0; width: 0; height: 3mm; border-left: 1.8mm solid #000; }

        .f   { position: absolute; white-space: nowrap; line-height: 1; }
        .t   { position: absolute; white-space: nowrap; line-height: 1; font-size: 9px; font-weight: 700; color: #5a4424; }
        .c   { text-align: center; }
        .cs  { font-size: 34px; font-weight: 800; letter-spacing: -1px; }
        .big { font-size: 26px; font-weight: 800; }
        .mid { font-size: 20px; font-weight: 700; }
        .n   { font-size: 17px; }
        .sm  { font-size: 13px; }
        .xs  { font-size: 11px; }
    </style>
</head>

<div id="strip">
